{# شعار اللوحة: شكل ورقة نمو #}
{% macro panel_mark(size=34) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" aria-hidden="true">
  <defs>
    <linearGradient id="pm-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a497ff"/><stop offset="1" stop-color="#5b4cf0"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#pm-g)"/>
  <path d="M12 27c0-8 6-14 16-15-1 10-7 16-15 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 27 21 19" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
{%- endmacro %}
